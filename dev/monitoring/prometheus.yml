# Local Prometheus for DriftHound (see docker-compose.monitoring.yml).
#
# The scrape token is written to dev/monitoring/.token by `make docker-monitoring-start`.
# Prometheus re-reads credentials_file on every scrape, so a new token is picked up
# without a restart.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: drifthound
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/.token
    static_configs:
      - targets: [ "app:3000" ]
